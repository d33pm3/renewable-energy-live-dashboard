name: Regenerate lockfile

on:
  push:
    branches: [ci/npm-ci-baseline]
    paths:
      - ".github/workflows/regenerate-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci/npm-ci-baseline
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Regenerate package-lock.json from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "lockfile already current"
          else
            git commit -m "chore: regenerate package-lock.json for npm ci"
            git push
          fi
