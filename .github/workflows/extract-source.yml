name: Extract tracked source

on:
  push:
    branches: [fix/tracked-source-self-contained]
    paths:
      - ".github/workflows/extract-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/tracked-source-self-contained
      - name: Extract legitimate source from Codebase.zip
        run: |
          set -euo pipefail
          unzip -qo Codebase.zip
          test -d "5_Renewable Energy/src"
          test -f "5_Renewable Energy/src/pages/Index.tsx"
          test -f "5_Renewable Energy/src/lib/ctuil.ts"
          mkdir -p src public supabase
          cp -a "5_Renewable Energy/src/." src/
          cp -a "5_Renewable Energy/public/." public/
          cp -a "5_Renewable Energy/supabase/." supabase/
          rm -rf "5_Renewable Energy"
          test -f src/pages/Index.tsx
          test -f src/lib/ctuil.ts
          test -f src/components/landing/HeroSection.tsx
          test -f supabase/functions/ctuil-ingest/index.ts
          if grep -RInE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_|github_pat_|AKIA[0-9A-Z]{16}|sk_live_' src public supabase; then
            echo "Refusing to commit secret-like material" >&2
            exit 1
          fi
      - name: Commit extracted source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public supabase
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: track complete application source extracted from Codebase.zip"
          git push origin HEAD:fix/tracked-source-self-contained
